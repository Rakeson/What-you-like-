<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>What You Like</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column like a test booklet; an inkblot built from your answers sits beside each question and becomes the cover of your reading. */
:root{
  --paper:#EDEFF4; --card:#F9FAFC; --ink:#1E1C52; --muted:#5A5E7C; --line:#D3D6E3; --accent:#B3305F; --accent-soft:#F3DCE5;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111230; --card:#191B3F; --ink:#DCDAF7; --muted:#9C9EC4; --line:#2D3063; --accent:#F07DAA; --accent-soft:#3A2146; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111230; --card:#191B3F; --ink:#DCDAF7; --muted:#9C9EC4; --line:#2D3063; --accent:#F07DAA; --accent-soft:#3A2146; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55; padding-inline:16px; -webkit-font-smoothing:antialiased}
.wrap{max-width:680px; margin:0 auto; padding-block:28px 64px}
.wrap.wide{max-width:920px}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; letter-spacing:-0.01em}
p{margin:0}
button{font:inherit; color:inherit}
.eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

/* top bar */
.bar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap}
.brand{font-family:var(--display); font-weight:800; font-size:18px}
.steps{display:flex; gap:6px; align-items:center}
.steps i{display:block; width:22px; height:6px; border-radius:3px; background:var(--line); transition:background .3s}
.steps i.done{background:var(--ink)}
.steps i.now{background:var(--accent)}

/* intro */
.intro{display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:32px; align-items:center}
.intro h1{font-size:clamp(44px,9vw,76px); font-weight:800; line-height:.95}
.lede{font-size:19px; margin-top:18px; max-width:34em}
.facts{display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:22px; font-family:var(--mono); font-size:13px; color:var(--muted)}
.facts b{color:var(--ink); font-weight:500}
.fine{margin-top:22px; font-size:14px; color:var(--muted); max-width:36em; border-top:1px solid var(--line); padding-top:14px}
.intro canvas{width:220px; height:220px; max-width:100%}
@media (max-width:620px){.intro{grid-template-columns:1fr}.intro canvas{width:160px;height:160px;order:-1}}

.btn{display:inline-flex; align-items:center; gap:10px; border:0; background:var(--ink); color:var(--card); padding:13px 22px; border-radius:999px; font-family:var(--display); font-weight:600; font-size:16px; cursor:pointer}
.btn:hover{background:var(--accent)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink); background:transparent}
.btn:focus-visible,.opt:focus-visible,textarea:focus-visible,.link:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}

/* question */
.q{display:grid; grid-template-columns:minmax(0,1fr) 96px; gap:8px 24px; align-items:start}
.q canvas{width:96px; height:96px; grid-column:2; grid-row:1 / span 2}
.q .eyebrow{grid-column:1}
.prompt{grid-column:1; font-size:clamp(26px,5vw,34px); font-weight:600; line-height:1.15; margin-top:6px}
.opts{display:grid; gap:10px; margin-top:26px}
.opt{display:flex; gap:14px; align-items:baseline; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px 18px; cursor:pointer; font-size:18px; transition:border-color .15s, transform .15s}
.opt:hover{border-color:var(--ink)}
.opt.picked{border-color:var(--accent); background:var(--accent-soft)}
.key{font-family:var(--mono); font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:1px 6px; flex:none}
.timer{height:3px; background:var(--line); border-radius:2px; margin-top:22px; overflow:hidden}
.timer span{display:block; height:100%; width:100%; background:var(--accent); transform-origin:left; animation:drain 8s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.gut{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:8px; min-height:1.5em}
textarea{width:100%; min-height:140px; margin-top:22px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; font:inherit; font-size:18px; resize:vertical}
.hint{font-size:14px; color:var(--muted); margin-top:10px}
.link{background:none; border:0; padding:0; color:var(--muted); text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-size:15px}
.link:hover{color:var(--ink)}
.fade{animation:in .35s ease both}
@keyframes in{from{opacity:.001; transform:translateY(6px)}to{opacity:1; transform:none}}

/* guess + loading */
.guess{font-family:var(--display); font-size:clamp(24px,4.6vw,32px); line-height:1.25; font-weight:400; margin-top:14px}
.thinking{display:flex; gap:20px; align-items:center; margin-top:10px}
.thinking canvas{width:120px; height:120px; animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.choices{display:grid; gap:10px; margin-top:24px}

/* results */
.hero{display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:32px; align-items:center; padding-bottom:36px; border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(34px,6.4vw,58px); font-weight:800; line-height:1.02; margin-top:10px}
.hero p.portrait{font-size:19px; margin-top:18px; max-width:36em}
.hero canvas{width:260px; height:260px; max-width:100%}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero canvas{width:180px;height:180px;order:-1}}
section.block{padding-block:36px; border-bottom:1px solid var(--line)}
section.block h2{font-size:26px; font-weight:700}
section.block > p.sub{color:var(--muted); margin-top:6px; font-size:16px; max-width:40em}

.spec{display:grid; gap:18px; margin-top:24px}
.axis{display:grid; grid-template-columns:120px minmax(0,1fr) 120px 70px; gap:12px; align-items:center; font-size:15px}
.axis .l{text-align:right}
.track{position:relative; height:24px}
.track::before{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--line)}
.track::after{content:""; position:absolute; left:50%; top:6px; bottom:6px; width:1px; background:var(--line)}
.dot{position:absolute; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:var(--ink)}
.pill{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; border-radius:999px; padding:2px 8px; text-align:center; border:1px solid var(--line); color:var(--muted)}
.pill.clear{background:var(--ink); color:var(--card); border-color:var(--ink)}
.pill.leaning{border-color:var(--ink); color:var(--ink)}
@media (max-width:620px){
  .axis{grid-template-columns:1fr 1fr; gap:4px 12px}
  .axis .l{text-align:left}.axis .r{text-align:right}
  .axis .track{grid-column:1 / -1; grid-row:2}
  .axis .pill{grid-column:1 / -1; justify-self:start}
}

.likes{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:28px 32px; margin-top:24px}
.likes h3{font-family:var(--mono); font-size:12px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:10px}
.likes ul{list-style:none; margin:0; padding:0; display:grid; gap:12px}
.likes li b{font-weight:600; display:block}
.likes li span{font-size:15px; color:var(--muted)}

.niches{display:grid; gap:14px; margin-top:24px; counter-reset:n}
.niche{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px 28px}
.niche h3{font-size:21px; font-weight:700; grid-column:1 / -1}
.niche .what{grid-column:1 / -1; font-style:italic; color:var(--muted); font-size:16px}
.niche dl{margin:8px 0 0}
.niche dt{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.niche dd{margin:2px 0 0; font-size:16px}
@media (max-width:620px){.niche{grid-template-columns:1fr}}

.trace{display:grid; gap:0; margin-top:20px}
.trace > div{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px 28px; padding-block:16px; border-top:1px dashed var(--line)}
.trace > div:first-child{border-top:0}
.trace .tq{font-family:var(--display); font-weight:600; font-size:18px; line-height:1.3}
.trace .ta{font-size:15px; color:var(--muted); margin-top:4px}
.trace .tm{font-size:16px}
.trace .tm::before{content:"Quietly measuring"; display:block; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:2px}
@media (max-width:620px){.trace > div{grid-template-columns:1fr}}

.pull{font-family:var(--display); font-size:clamp(22px,4vw,28px); line-height:1.3; margin-top:16px; max-width:30em}
.keep{background:var(--ink); color:var(--card); border-radius:var(--r); padding:28px; margin-top:36px}
.keep .eyebrow{color:inherit; opacity:.7}
.keep p.kq{font-family:var(--display); font-size:clamp(22px,4vw,30px); line-height:1.25; margin-top:10px}
.foot{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; justify-content:space-between; margin-top:32px}
.foot small{font-family:var(--mono); font-size:12px; color:var(--muted)}
.toast{font-family:var(--mono); font-size:12px; color:var(--accent)}
@media (prefers-reduced-motion: reduce){
  .fade,.thinking canvas{animation:none}
  .timer span{animation:none; transform:scaleX(1)}
}
</style>
<style>
.prog{flex:1; max-width:220px; height:4px; background:var(--line); border-radius:2px; overflow:hidden}
.prog span{display:block; height:100%; background:var(--accent); transition:width .3s}
.bars{display:grid; gap:10px; margin-top:22px}
.barrow{display:grid; grid-template-columns:120px minmax(0,1fr) 44px; gap:12px; align-items:center; font-size:15px}
.barrow .trk{background:var(--line); border-radius:5px; overflow:hidden}
.barrow .trk i{display:block; height:10px; border-radius:5px; background:var(--ink)}
.barrow.top .trk i{background:var(--accent)}
.barrow b{font-family:var(--mono); font-weight:500; font-size:13px; text-align:right; font-variant-numeric:tabular-nums}
.code{font-family:var(--mono); letter-spacing:.2em; color:var(--accent)}
.jobs{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px; font-size:16px}
.jobs a{color:var(--ink); text-underline-offset:3px}
.jobs small{color:var(--muted); font-family:var(--mono); font-size:12px; margin-left:8px; white-space:nowrap}
.niche dd + dd{margin-top:8px}
.hob{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:18px 32px; margin:24px 0 0; padding:0; list-style:none}
.hob b{font-weight:600; display:block}
.hob span{font-size:15px; color:var(--muted)}
.rate{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.rate .opt{width:auto; padding:10px 14px; font-size:15px}
.cardimg{max-width:340px; width:100%; border-radius:var(--r); border:1px solid var(--line); display:block; margin-top:20px}
.method{font-size:14px; color:var(--muted); max-width:44em; margin-top:28px; border-top:1px solid var(--line); padding-top:14px}
.method a{color:inherit}
@media (max-width:620px){.barrow{grid-template-columns:96px minmax(0,1fr) 40px}}
</style>

<div class="wrap" id="wrap">
  <div class="bar">
    <div class="brand">What You Like</div>
    <div class="prog" id="prog" aria-label="Progress" hidden><span></span></div>
  </div>
  <main id="screen"></main>
</div>

<script>
/* ---------------- Config ---------------- */
// Paste a Google Form (or any https) link here to give testers a place to send feedback.
const FEEDBACK_URL = '';

/* ---------------- Model: six Holland types + four style axes ---------------- */
const TYPES = 'RIASEC'.split('');
const T = {
  R:{name:'Maker', title:'works things out with their hands', guess:'get your hands on something real and make it work',
     desc:'You seem to think best with something physical in front of you: tools, materials, a body in motion.',
     why:'Practical, physical work with a result you can see.', drain:'A week of physical, hands-on work',
     card:'Whether hands-on, physical work pulls you in. This is the Realistic strand of the Holland model.'},
  I:{name:'Investigator', title:'follows questions to the bottom', guess:'chase a question until it gives up its answer',
     desc:'You seem drawn to things that need figuring out, and you stay with a problem after other people move on.',
     why:'Runs on curiosity, evidence and figuring things out.', drain:'A week alone with one hard problem',
     card:'Whether puzzles and unexplained things pull you in. This is the Investigative strand.'},
  A:{name:'Creator', title:'makes things that were not there before', guess:'make something that did not exist this morning',
     desc:'You seem to want room to shape things your own way, and you notice how things look, sound and feel.',
     why:'Open-ended work where your own taste shapes the result.', drain:'A week with no brief and a blank page',
     card:'Whether open-ended making and self-expression pull you in. This is the Artistic strand.'},
  S:{name:'Helper', title:'pays attention to people', guess:'be useful to an actual person in front of you',
     desc:'You seem to notice how people are doing, and helping or teaching gives you energy back.',
     why:'Centred on helping, teaching or caring for people.', drain:'A week of looking after other people',
     card:'Whether helping, teaching and looking after people pull you in. This is the Social strand.'},
  E:{name:'Persuader', title:'gets things moving', guess:'take charge and get something off the ground',
     desc:'You seem comfortable taking the lead, making the case and betting on an idea.',
     why:'Rewards initiative, persuasion and taking the lead.', drain:'A week of pitching and persuading',
     card:'Whether leading, selling and taking risks pull you in. This is the Enterprising strand.'},
  C:{name:'Organizer', title:'puts things in order', guess:'bring order to something messy',
     desc:'You seem to enjoy getting details right and turning a mess into a system that works.',
     why:'Rewards accuracy, structure and systems people can rely on.', drain:'A week of forms, records and checking details',
     card:'Whether order, detail and clear systems pull you in. This is the Conventional strand.'},
};
const STY = [
  {id:'d', left:'Familiar', right:'Unknown'},
  {id:'e', left:'Solitude', right:'Company'},
  {id:'f', left:'Process', right:'Outcome'},
  {id:'t', left:'Warm & bright', right:'Dim & mysterious'},
];
const SP = {
  d:{'-1':"you go deep on what you already love instead of chasing what is new", '1':"you would rather take the unmarked street than the recommended one"},
  e:{'-1':"you recharge alone and choose your company carefully", '1':"you come alive around other people"},
  f:{'-1':"the doing is the reward for you, and the finish line is a bonus", '1':"you like things to land, finished and whole"},
  t:{'-1':"you lean toward warmth, daylight and things that leave you lighter", '1':"you feel at home in dim light, fog and open questions"},
};

/* ---------------- Question bank ---------------- */
const lines = s => s.trim().split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split('|'));
const parseW = s => { const w={}; s.split(' ').filter(Boolean).forEach(x=>{ w[x[0]]=parseFloat(x.slice(1)); }); return w; };

const CARD_RAW = {
R:`A mechanical watch, taken apart on a workbench
A vegetable bed that needs digging over
A bicycle with a slipped chain
A flat-pack shelf with no instructions
A trail map and a pair of muddy boots
A sourdough starter that needs feeding`,
I:`A telescope pointed at something faint
A dataset nobody has looked at yet
A fossil with a handwritten label
A crossword with three clues left
A documentary about how black holes form
A test result that should not be possible`,
A:`A blank sketchbook and one good pen
An empty stage an hour before the show
A synthesizer with too many knobs
A camera with one roll of film left
A half-finished short story
Fabric scraps and a sewing machine`,
S:`A friend who needs to talk something through
A classroom of ten-year-olds with questions
A community garden work day
A newcomer who knows nobody at the party
A first-aid kit and someone with a scraped knee
A neighbour learning to use a smartphone`,
E:`A market stall and something to sell
A room that needs convincing
A group project with no leader
A negotiation over the price of a used car
A pitch you have ninety seconds to give
A club that needs twenty more members`,
C:`A messy spreadsheet that could be tidy
A shelf of books in no order at all
A trip itinerary with every train time checked
A budget that has to balance to the cent
A drawer of tangled cables and a label maker
A checklist with one box left to tick`,
};
const CARDS = [];
TYPES.forEach(ty => lines(CARD_RAW[ty]).forEach((l,i)=>CARDS.push({id:'c'+ty+i, ty, t:l[0]})));

// Small scenes. Weights: R I A S E C are the Holland types; d e f t are the style axes.
const SCEN = [
 {p:"Halfway through a party, you are usually…", m:"Where you drift when nobody is directing you: toward the crowd, one person, a task, or the door.",
  o:[["In the middle of the loudest group","E1 S.5 e1.5"],["In the kitchen, deep in one conversation","S1 I.5 e.3"],["Fixing the speaker that keeps cutting out","R1.5"],["Planning a quiet exit","I.3 e-1.5"]]},
 {p:"A week in a city you have never seen. First morning:", m:"Whether you meet the unknown with a plan, a wander, a person or a question.",
  o:[["Follow the itinerary I built at home","C1.5 d-1"],["Walk until I am lost","A.5 d1.5"],["Find a local to show me around","S1 E.5 e1"],["Head for the museum I read about","I1.5"]]},
 {p:"A group project lands on your table. You reach for…", m:"The role you take by default: leading, structuring, solving or shaping.",
  o:[["The whiteboard, to hand out roles","E1.5"],["The shared doc, to set up the structure","C1.5"],["The hard part nobody understands yet","I1.5"],["The part that has to look good","A1.5"]]},
 {p:"Something at home breaks. You…", m:"Four ways of meeting a problem: with hands, with reasoning, with people, or with a deal.",
  o:[["Take it apart to see how it works","R1.5 I.5"],["Look up exactly why it failed","I1.5"],["Call someone who knows, and chat while they fix it","S1 e1"],["Replace it with a better one and sell the old one","E1 f1"]]},
 {p:"A whole free day appears out of nowhere.", m:"What you do when nothing is required of you is the cleanest signal there is.",
  o:[["Make something with my hands","R1 A.5 f-.5"],["Go down a rabbit hole on one topic","I1.5 e-1"],["See who is around","S1.5 e1.5"],["Finally sort out the thing I keep putting off","C1.5 f1"]]},
 {p:"In a museum, you linger longest at…", m:"What holds your attention: mechanisms, explanations, beauty, or other people.",
  o:[["The machines and tools","R1.5"],["The explanations on the wall","I1.5"],["One painting, for a long time","A1.5 f-1"],["The other visitors, and how they react","S1"]]},
 {p:"Pick a gift for yourself.", m:"A gift is a wish in disguise: to make, to learn, to gather people, or to start something.",
  o:[["A good set of tools","R1.5"],["A year of courses in anything I want","I1 d1"],["A handmade object with a story","A1.5"],["A dinner for six people I choose","S1.5 e1"],["Seed money for an idea","E1.5 d1"]]},
 {p:"At ten years old, you could spend a whole afternoon…", m:"Childhood absorptions tend to be stable. What held you then often still does.",
  o:[["Building forts, models or brick sets","R1.5"],["Reading about dinosaurs, space or how things work","I1.5"],["Drawing, writing or putting on shows","A1.5"],["Sorting collections: cards, stickers, rocks","C1.5"],["Running a game with rules for everyone","E1 S.5 e1"]]},
 {p:"A new restaurant opens. What do you notice first?", m:"The lens you bring to an ordinary place: operations, aesthetics, people or business.",
  o:[["How the kitchen is run","C1 R.5"],["The lighting and the plates","A1.5"],["Whether the staff seem happy","S1.5"],["Whether the place will make money","E1.5"]]},
 {p:"Which headline do you click?", m:"Curiosity has a direction. This checks which way yours points.",
  o:[["Scientists cannot explain this signal","I1.5 t1"],["The town that rebuilt itself by hand","R1 S.5"],["How a 24-year-old built a brand from nothing","E1.5"],["The lost album, found after forty years","A1.5 t.5"]]},
 {p:"You have four volunteer hours. You spend them…", m:"The same generous impulse, expressed through four different kinds of work.",
  o:[["Repairing bikes","R1.5"],["Tutoring one student","S1.5"],["Running the fundraising table","E1.5"],["Doing the charity's books","C1.5"]]},
 {p:"Which rabbit hole gets you at 1 a.m.?", m:"What you watch when nobody is counting says more than what you say you like.",
  o:[["Restoration videos","R1.5 f-1"],["Unsolved mysteries","I1 t1.5"],["Someone's portfolio","A1.5"],["Productivity systems","C1.5"],["Founder interviews","E1.5"]]},
 {p:"Which compliment lands best?", m:"The praise you want most points at the identity you are building.",
  o:[["You make things work.","R1.5"],["You always ask the right question.","I1.5"],["Nobody else would have thought of that.","A1.5"],["People feel better around you.","S1.5"],["You could sell anything.","E1.5"],["Nothing slips past you.","C1.5"]]},
 {p:"On board-game night you are…", m:"Play strips away job titles. This is how you behave when it is only a game.",
  o:[["Reading the rulebook so we play it right","C1.5"],["Working out the best strategy","I1.5 f1"],["Making alliances and breaking them","E1.5 e1"],["Making sure everyone is having fun","S1.5"]]},
 {p:"Your ideal workspace has…", m:"The room you would build for yourself shows the work you want to be doing in it.",
  o:[["A workbench and good tools","R1.5"],["A wall of pinned-up references","A1 I.5"],["People dropping by","S1 E.5 e1.5"],["One clean desk, everything in its place","C1.5 e-.5"]]},
 {p:"The school subject you secretly liked:", m:"Not the one you were best at. The one you liked says more about fit.",

/* ---------------- State ---------------- */
const PLAN = ['card','card','card','card','scen','scen','style','style','card','card','card','card','scen','style','style','pair','pair','pair','verify','prep'];
let S;
function fresh(){ return {phase:'intro', plan:[...PLAN], qi:0, cur:null, answers:[], used:[], flags:[], maxZone:5, guess:null, reaction:null, shownAt:0, rating:0}; }

/* ---------------- Scoring ---------------- */
function scores(){
  const sc={}, abs={d:0,e:0,f:0,t:0};
  [...TYPES,'d','e','f','t'].forEach(k=>sc[k]=0);
  for (const a of S.answers) for (const k in a.w){ sc[k]+=a.w[k]; if (k in abs) abs[k]+=Math.abs(a.w[k]); }
  return {sc,abs};
}
function rank(){ const {sc}=scores(); return [...TYPES].sort((a,b)=>sc[b]-sc[a]); }
const used = id => S.used.includes(id);
const pick = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=[...a]; for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function cos(v,w){ let d=0,n1=0,n2=0; for (let i=0;i<v.length;i++){ d+=v[i]*w[i]; n1+=v[i]*v[i]; n2+=w[i]*w[i]; } return d/(Math.sqrt(n1*n2)||1); }
function median(a){ if (!a.length) return 0; const s=[...a].sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; }

/* ---------------- Question selection ---------------- */
function makeQ(kind){
  if (kind==='card'){
    const carded=S.answers.filter(a=>a.kind==='card').map(a=>a.ty);
    const pool=TYPES.filter(t=>!carded.includes(t));
    const ty = pool.length ? pick(pool) : rank()[(carded.length-6)%2];
    const c = pick(CARDS.filter(x=>x.ty===ty && !used(x.id))) || pick(CARDS.filter(x=>!used(x.id)));
    return {id:c.id, kind, ty:c.ty, label:'First reaction', prompt:c.t, measures:T[c.ty].card,
      opts:[{t:'Yes, that pulls me in',w:{[c.ty]:1.5}},{t:'Could take it or leave it',w:{[c.ty]:.2}},{t:'Not for me',w:{[c.ty]:-1}}]};
  }
  if (kind==='scen'){
    const top=rank().slice(0,3);
    const cands=SCEN.filter(q=>!used(q.id)).map(q=>({q, s:q.o.filter(o=>top.some(t=>o.w[t])).length + Math.random()*1.5}));
    cands.sort((a,b)=>b.s-a.s);
    const q=cands[0].q;
    return {id:q.id, kind, label:'A small scene', prompt:q.p, measures:q.m, opts:q.o};
  }
  if (kind==='style'){
    const {abs}=scores();
    const axes=STY.map(a=>a.id).filter(ax=>STYLEQ.some(q=>q.ax===ax && !used(q.id))).sort((a,b)=>abs[a]-abs[b]);
    const q=pick(STYLEQ.filter(x=>x.ax===axes[0] && !used(x.id)));
    return {id:q.id, kind, label:'A small scene', prompt:q.p, measures:q.m, opts:q.o};
  }
  if (kind==='pair'){
    const r=rank().slice(0,4), {sc}=scores(), cand=[];
    for (let i=0;i<4;i++) for (let j=i+1;j<4;j++) cand.push([r[i],r[j],sc[r[i]]-sc[r[j]]+(i+j)*.4]);
    cand.sort((x,y)=>x[2]-y[2]);
    let p=null;
    for (const [a,b] of cand){
      const k=TYPES.indexOf(a)<TYPES.indexOf(b)?a+b:b+a;
      const it=PAIRS.filter(x=>x.k===k && !used(x.id));
      if (it.length){ p=pick(it); break; }
    }
    if (!p) p=pick(PAIRS.filter(x=>!used(x.id)));
    const A=p.k[0], B=p.k[1];
    const o=[{t:p.a,w:{[A]:1.5,[B]:-.5}},{t:p.b,w:{[B]:1.5,[A]:-.5}}];
    if (Math.random()<.5) o.reverse();
    return {id:p.id, kind, label:'A closer call', prompt:p.p, opts:o,
      measures:`A direct choice between your ${T[A].name} and ${T[B].name} sides, which were running close.`};
  }
  if (kind==='verify'){
    const r=rank();
    const o=shuffle([r[0],r[2],r[4],r[5]]).map(x=>({t:T[x].drain, w:{[x]:x===r[0]?-1.5:-1}, flag:x===r[0]?x:null}));
    return {id:'verify', kind, label:'A reverse check', prompt:'Which of these would wear you out fastest?', opts:o,
      measures:'A reverse check. If the thing that tires you fastest is also your strongest strand, that tension is worth knowing about.'};
  }
  return {id:'prep', kind:'prep', label:'One practical question', prompt:'If something really fit you, how long would you train for it?',
    measures:'Not a hidden question. It filters the careers list to ones within the preparation you said you were up for.',
    opts:[{t:'I would want to start within months',w:{},z:2},{t:'A year or two',w:{},z:3},{t:'A full degree',w:{},z:4},{t:'As long as it takes',w:{},z:5}]};
}

/* ---------------- Inkblot ---------------- */
function rng(seed){ let h=2166136261; for (const c of seed) h=Math.imul(h^c.charCodeAt(0),16777619); return ()=>{ h+=0x6D2B79F5; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
function blobsFor(list){
  const out=[{x:.03,y:.5,r:.1},{x:.02,y:.36,r:.06}];
  const shrink=1/Math.sqrt(1+list.length/6);
  list.forEach((key,i)=>{
    const R=rng(key); const n=1+Math.floor(R()*2);
    const spread=Math.min(.38,.1+i*.017);
    for (let j=0;j<n;j++){
      const ang=R()*Math.PI*2, d=spread*(.45+R()*.55);
      out.push({x:Math.min(.4,Math.abs(Math.cos(ang))*d*.8+.01), y:.5+Math.sin(ang)*d, r:(.018+R()*.04)*shrink});
    }
  });
  return out;
}
function drawBlot(canvas, keys, px, inkOverride){
  const css=getComputedStyle(document.documentElement);
  const ink=inkOverride||css.getPropertyValue('--ink').trim()||'#1E1C52';
  const dpr=Math.min(2, window.devicePixelRatio||1);
  const size=px||Math.round(canvas.clientWidth*dpr)||200;
  canvas.width=size; canvas.height=size;
  const ctx=canvas.getContext('2d');
  const img=ctx.createImageData(size,size);
  const m=/^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(ink)||[0,'1e','1c','52'];
  const cr=parseInt(m[1],16), cg=parseInt(m[2],16), cb=parseInt(m[3],16);
  const blobs=blobsFor(keys);
  const half=size/2;
  for (let py=0; py<size; py++){
    const y=py/size;
    for (let x0=0; x0<half; x0++){
      const dx=(half-x0)/size;
      let f=0;
      for (const b of blobs){ const ddx=dx-b.x, ddy=y-b.y; f+=b.r*b.r/(ddx*ddx+ddy*ddy+1e-5); }
      f+= .04*Math.sin(dx*60+y*23)*Math.sin(y*41);
      if (f>1){
        const a=Math.min(1,(f-1)*2.2);
        const core=f>2.4?1:(f>1.6?.9:.82);
        const alpha=Math.round(255*a*core);
        for (const X of [x0, size-1-x0]){ const i=(py*size+X)*4; img.data[i]=cr; img.data[i+1]=cg; img.data[i+2]=cb; img.data[i+3]=alpha; }
      }
    }
  }
  ctx.putImageData(img,0,0);
}
function blotKeys(){ return S.answers.map(a=>a.id+':'+a.i); }
const SAMPLE=['sample:a','sample:b','sample:c','sample:d','sample:e','sample:f','sample:g','sample:h','sample:i'];
function redrawAll(){ document.querySelectorAll('canvas[data-blot]').forEach(c=>drawBlot(c, c.dataset.blot==='sample'?SAMPLE:blotKeys())); }

/* ---------------- Rendering ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function progress(frac){
  const el=$('#prog');
  if (frac==null){ el.hidden=true; return; }
  el.hidden=false; el.firstElementChild.style.width=Math.round(frac*100)+'%';
}
function mount(html, frac){
  progress(frac);
  $('#screen').innerHTML=`<div class="fade">${html}</div>`;
  requestAnimationFrame(redrawAll);
  window.scrollTo({top:0});
}

function renderIntro(){
  $('#wrap').classList.remove('wide');
  mount(`
  <div class="intro">
    <div>
      <p class="eyebrow">A short test with a twist</p>
      <h1>What do you actually like?</h1>
      <p class="lede">Twenty quick taps. Each one is quietly measuring something. At the end you get a guess, a reading of your interests, careers and hobbies that might fit, and the reveal of what every question was really asking.</p>
      <div class="facts"><span><b>~4</b> minutes</span><span><b>20</b> questions</span><span><b>0</b> typing</span></div>
      <div class="row" style="margin-top:28px"><button class="btn" id="go">Begin</button></div>
      <p class="fine">This is a mirror, not a diagnosis. No sign-in is needed and nothing you tap leaves this page: the result is worked out in your browser from a fixed question bank, ${OCC.length} occupations, ${HOB.length} hobbies and ${NICHE.length} niche fields.</p>
    </div>
    <canvas data-blot="sample" aria-hidden="true"></canvas>
  </div>`, null);

function renderQuestion(){
  const q=S.cur, n=S.qi+1, extra=S.qi>=PLAN.length;
  const count = extra ? `Extra question ${n-PLAN.length} of ${S.plan.length-PLAN.length}` : `Question ${n} of ${PLAN.length}`;
  mount(`
  <div class="q">
    <p class="eyebrow">${count} · ${esc(q.label)}</p>
    <canvas data-blot="live" aria-hidden="true"></canvas>
    <h2 class="prompt" id="qp">${esc(q.prompt)}</h2>
  </div>
  <div class="opts" role="group" aria-labelledby="qp">
    ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${i+1}</span><span>${esc(o.t)}</span></button>`).join('')}
  </div>`, Math.min(1,S.qi/S.plan.length));
  S.shownAt=performance.now();
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i,b));
}
let locked=false;
function choose(i,btn){
  if (locked) return; locked=true;
  const q=S.cur, o=q.opts[i];
  if (o.flag) S.flags.push(o.flag);
  if (o.z) S.maxZone=o.z;
  S.answers.push({id:q.id, i, w:o.w, ms:Math.round(performance.now()-S.shownAt), kind:q.kind, ty:q.ty||null, prompt:q.prompt, choice:o.t, measures:q.measures});
  btn && btn.classList.add('picked');
  setTimeout(()=>{ locked=false; S.qi++; S.cur=null; next(); }, 240);
}
document.addEventListener('keydown',e=>{
  if (e.metaKey || e.ctrlKey || e.altKey || document.activeElement?.tagName==='TEXTAREA') return;
  const n=parseInt(e.key,10); if (!n) return;
  if (S?.phase==='q'){ const b=document.querySelector(`.opt[data-i="${n-1}"]`); if (b) b.click(); }
  else if (S?.phase==='confirm'){ const b=document.querySelectorAll('[data-r]')[n-1]; if (b) b.click(); }
});

function next(){
  if (S.qi<S.plan.length){
    S.phase='q';
    if (!S.cur){ S.cur=makeQ(S.plan[S.qi]); S.used.push(S.cur.id); }
    return renderQuestion();
  }
  if (!S.guess) return showGuess();
  renderResult();
}

/* ---------------- Guess ---------------- */
function showGuess(){
  const r=rank(), low=r[5];
  S.guess=`My guess: you are happiest when you get to ${T[r[0]].guess}, and part of you also wants to ${T[r[1]].guess}. ${T[low].drain} sounds like your idea of a bad time.`;
  S.phase='confirm';
  mount(`
  <p class="eyebrow">The guess</p>
  <p class="guess">${esc(S.guess)}</p>
  <p class="hint" style="margin-top:14px">How close is that?</p>
  <div class="choices">
    <button class="opt" data-r="yes"><span class="key">1</span><span>That's me</span></button>
    <button class="opt" data-r="partly"><span class="key">2</span><span>Partly</span></button>
    <button class="opt" data-r="no"><span class="key">3</span><span>Not really</span></button>
  </div>
  <p class="hint">If the guess is off, you get two more questions before the reading.</p>`, 1);
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    S.reaction=b.dataset.r;
    if (S.reaction!=='yes') S.plan.push('pair','pair');
    next();
  });
}

/* ---------------- Reading ---------------- */
function reading(){
  const {sc,abs}=scores(), r=rank();
  const lo=Math.min(...TYPES.map(t=>sc[t]));
  let u=TYPES.map(t=>sc[t]-lo); if (!u.some(x=>x>0)) u=[1,1,1,1,1,1];
  const us=STY.map(a=>Math.tanh(sc[a.id]/2.5));
  const pct=Object.fromEntries(TYPES.map(t=>[t,Math.round(50+50*Math.tanh(sc[t]/4))]));
  const style=STY.map((a,i)=>({...a, v:us[i], cert:Math.abs(us[i])>.5?'clear':Math.abs(us[i])>.2?'leaning':'mixed'}));
  const sTop=[...style].sort((a,b)=>Math.abs(b.v)-Math.abs(a.v))[0];
  const title=`Someone who ${T[r[0]].title} and ${T[r[1]].title}`;
  const portrait=`${T[r[0]].desc} ${T[r[1]].desc}${Math.abs(sTop.v)>.2?` You may also find that ${SP[sTop.id][sTop.v<0?'-1':'1']}.`:''}`;

  // hobbies
  const hs=HOB.map(h=>{ const nz=h.s.filter(x=>x).length||1; const st=h.s.reduce((a,x,i)=>a+x*us[i],0)/nz; return {h, s:.65*cos(u,h.v)+.35*st}; }).sort((a,b)=>b.s-a.s);

  // careers
  const elig=OCC.filter(o=>o.z<=S.maxZone).map(o=>({o, s:cos(u,o.v)})).sort((a,b)=>b.s-a.s);
  const byCl={};
  elig.forEach(x=>(byCl[x.o.cl]=byCl[x.o.cl]||[]).push(x));
  const cls=Object.entries(byCl).filter(([,a])=>a.length>=3).map(([cl,a])=>({cl, jobs:a.slice(0,5), s:(a[0].s+a[1].s+a[2].s)/3})).sort((a,b)=>b.s-a.s).slice(0,3);
  const taken=new Set();
  cls.forEach(c=>{
    const cv=[0,0,0,0,0,0]; c.jobs.forEach(j=>j.o.v.forEach((x,i)=>cv[i]+=x));
    let bi=0; cv.forEach((x,i)=>{ if (x*u[i]>cv[bi]*u[bi]) bi=i; });
    c.why=T[TYPES[bi]].why;
    c.tryFirst=hs.filter(x=>!taken.has(x.h.n)).map(x=>({h:x.h, s:.8*cos(cv,x.h.v)+.2*x.s})).sort((a,b)=>b.s-a.s).slice(0,2).map(x=>x.h);
    c.tryFirst.forEach(h=>taken.add(h.n));
  });
  const hobbies=hs.filter(x=>!taken.has(x.h.n)).slice(0,8).map(x=>x.h);
  const niches=NICHE.map(h=>{ const nz=h.s.filter(x=>x).length||1; const st=h.s.reduce((a,x,i)=>a+x*us[i],0)/nz; let bi=0; h.v.forEach((x,i)=>{ if (x*u[i]>h.v[bi]*u[bi]) bi=i; }); return {h, why:T[TYPES[bi]].why, s:.65*cos(u,h.v)+.35*st}; }).sort((a,b)=>b.s-a.s).slice(0,3);

  // tension
  let tension;
  if (S.flags.length){
    const f=S.flags[0];
    tension=`Your answers kept pointing at ${T[f].name} work, but when asked what would wear you out fastest you picked "${T[f].drain.toLowerCase()}". You may like this kind of work in small doses, or as a hobby more than as a job.`;
  } else if (sc[r[0]]-sc[r[1]]<1){
    tension=`Your top two strands, ${T[r[0]].name} and ${T[r[1]].name}, finished almost level. People with that mix often need both in the same week: work that lets you ${T[r[0]].guess} and also ${T[r[1]].guess}.`;
  } else {
    tension=`No contradictions showed up on the reverse check. Your lowest strand was ${T[r[5]].name}, by a clear margin. That is useful too: ${T[r[5]].drain.toLowerCase()} will probably cost you more than it gives back.`;
  }

  // trace
  const mean=TYPES.reduce((a,t)=>a+sc[t],0)/6;
  const scored=S.answers.filter(a=>a.kind!=='prep').map(a=>{ let s=0; for (const k in a.w) s+=a.w[k]*(TYPES.includes(k)?sc[k]-mean:sc[k]); return {a,s}; }).sort((x,y)=>y.s-x.s);
  const trace=[], per={};
  for (const x of scored){ per[x.a.kind]=(per[x.a.kind]||0)+1; if (per[x.a.kind]>2) continue; trace.push(x.a); if (trace.length===4) break; }

  return {r, pct, code:r.slice(0,3).join(''), style, title, portrait, cls, hobbies, niches, tension, trace};
}

function wrapText(x, text, maxW){
  const words=text.split(' '), out=[]; let line='';
  for (const w of words){ const t=line?line+' '+w:w; if (x.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t; }
  if (line) out.push(line); return out;
}
function drawCard(R){
  const c=document.createElement('canvas'); c.width=1080; c.height=1350;
  const x=c.getContext('2d');
  x.fillStyle='#EDEFF4'; x.fillRect(0,0,1080,1350);
  const b=document.createElement('canvas'); drawBlot(b, blotKeys(), 440, '#1E1C52'); x.drawImage(b,320,70);
  x.textBaseline='alphabetic';
  x.fillStyle='#5A5E7C'; x.font='500 26px "IBM Plex Mono", monospace'; x.fillText('WHAT YOU LIKE  ·  '+R.code, 80, 600);
  x.fillStyle='#1E1C52'; x.font='800 62px "Bricolage Grotesque", sans-serif';
  let y=690; wrapText(x,R.title,920).slice(0,4).forEach(l=>{ x.fillText(l,80,y); y+=72; });
  y+=20; x.fillStyle='#B3305F'; x.font='600 34px "Bricolage Grotesque", sans-serif';
  x.fillText(R.r.slice(0,3).map(t=>T[t].name).join('  ·  '),80,y);
  y+=80; x.fillStyle='#5A5E7C'; x.font='500 24px "IBM Plex Mono", monospace'; x.fillText('MIGHT SUIT',80,y);
  x.fillStyle='#1E1C52'; x.font='400 38px "Source Serif 4", Georgia, serif';
  R.cls.forEach(cl=>{ y+=54; x.fillText(cl.cl,80,y); });
  x.fillStyle='#5A5E7C'; x.font='500 22px "IBM Plex Mono", monospace'; x.fillText('A mirror, not a diagnosis.',80,1280);
  return c.toDataURL('image/png');
}
async function copyText(txt, toast, fallback){
  try { await navigator.clipboard.writeText(txt); toast.textContent='Copied'; }
  catch { toast.textContent='Copy is blocked here. Select the text below instead.'; if (fallback){ fallback.hidden=false; fallback.value=txt; fallback.focus(); fallback.select(); } }
}

function renderResult(){
  S.phase='result';
  $('#wrap').classList.add('wide');
  const R=reading();
  const med=median(S.answers.map(a=>a.ms))/1000;
  const pace=med<2.5?`fast and instinctive (about ${med.toFixed(1)} seconds a question), so this reading leans on gut reactions`:med<5?`steady (about ${med.toFixed(1)} seconds a question): some instinct, some thought`:`deliberate (about ${med.toFixed(1)} seconds a question), so this reading reflects considered choices more than reflexes`;
  const link=n=>`https://www.onetonline.org/find/quick?s=${encodeURIComponent(n)}`;
  mount(`
  <div class="hero">
    <div>
      <p class="eyebrow">Your reading · <span class="code">${R.code}</span></p>
      <h1>${esc(R.title)}</h1>
      <p class="portrait">${esc(R.portrait)}</p>
    </div>
    <canvas data-blot="live" role="img" aria-label="Your inkblot, drawn from your answers"></canvas>
  </div>

  <section class="block">
    <h2>Where you landed</h2>
    <p class="sub">Six interest strands from the Holland model. Your three strongest make your code, ${R.code}.</p>
    <div class="bars">
      ${R.r.map((t,i)=>`<div class="barrow${i<3?' top':''}"><span>${T[t].name}</span><div class="trk"><i style="width:${R.pct[t]}%"></i></div><b>${R.pct[t]}</b></div>`).join('')}
    </div>
    <p class="sub" style="margin-top:28px">And four style axes, which shape the hobby picks below.</p>
    <div class="spec">
      ${R.style.map(p=>`<div class="axis"><span class="l">${esc(p.left)}</span><div class="track"><span class="dot" style="left:${(50+p.v*46).toFixed(1)}%; opacity:${p.cert==='mixed'?.45:1}"></span></div><span class="r">${esc(p.right)}</span><span class="pill ${p.cert}">${p.cert}</span></div>`).join('')}
    </div>
  </section>

  <section class="block">
    <h2>Work that might fit</h2>
    <p class="sub">Three fields closest to your profile${S.maxZone<5?', limited to the preparation you said you were up for':''}. Each job links to its official O*NET entry. Each field comes with a low-cost way to test it first.</p>
    <div class="niches">
      ${R.cls.map(c=>`<article class="niche"><h3>${esc(c.cl)}</h3><p class="what">${esc(c.why)}</p>
        <dl><dt>Jobs to look at</dt><dd><ul class="jobs">${c.jobs.map(j=>`<li><a href="${link(j.o.n)}" target="_blank" rel="noopener">${esc(j.o.n)}</a><small>${ZONE[j.o.z]}</small></li>`).join('')}</ul></dd></dl>
        <dl><dt>Try it first</dt>${c.tryFirst.map(h=>`<dd><b>${esc(h.n)}.</b> ${esc(h.step)}</dd>`).join('')}</dl></article>`).join('')}
    </div>
  </section>

  <section class="block">
    <h2>Things you might like</h2>
    <p class="sub">Hobbies matched on both your interests and your style. Each has one thing to try this month.</p>
    <ul class="hob">${R.hobbies.map(h=>`<li><b>${esc(h.n)}</b><span>${esc(h.step)}</span></li>`).join('')}</ul>
  </section>

  <section class="block">
    <h2>Niche fields to explore</h2>
    <p class="sub">Small, specific corners of the world that most people never consider.</p>
    <div class="niches">
      ${R.niches.map(n=>`<article class="niche"><h3>${esc(n.h.n)}</h3><p class="what">${esc(n.h.what)}</p>
        <dl><dt>Why it fits</dt><dd>${esc(n.why)}</dd></dl><dl><dt>First step</dt><dd>${esc(n.h.step)}</dd></dl></article>`).join('')}
    </div>
  </section>

  <section class="block">
    <h2>What the questions were really asking</h2>
    <p class="sub">The answers that said the most about you.</p>
    <div class="trace">
      ${R.trace.map(a=>`<div><div><p class="tq">${esc(a.prompt)}</p><p class="ta">You chose: ${esc(a.choice)}</p></div><p class="tm">${esc(a.measures)}</p></div>`).join('')}
    </div>
  </section>

  <section class="block">
    <h2>Where you surprised yourself</h2>
    <p class="pull">${esc(R.tension)}</p>
    <p class="sub" style="margin-top:18px">Your answer style was ${esc(pace)}.</p>
  </section>

  <section class="block">
    <h2>Share your result</h2>
    <p class="sub">Press and hold (or right-click) the card to save it, or copy the text.</p>
    <img class="cardimg" id="cardimg" alt="Result card: ${esc(R.title)}">
    <div class="row" style="margin-top:16px"><button class="btn ghost" id="copy">Copy result text</button><span class="toast" id="toast" aria-live="polite"></span></div>
    <textarea id="copyfb" readonly hidden style="min-height:90px"></textarea>
  </section>

  <section class="block" style="border-bottom:0">
    <h2>How close was this?</h2>
    <p class="sub">Your rating helps improve the questions. Nothing is sent automatically.</p>
    <div class="rate" role="group" aria-label="Accuracy rating">
      ${['Way off','A little','Half right','Mostly me','Spot on'].map((l,i)=>`<button class="opt" data-rate="${i+1}">${i+1} · ${l}</button>`).join('')}
    </div>
    <textarea id="fbtext" maxlength="500" placeholder="What did it get right or wrong? (optional)" style="min-height:90px"></textarea>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="fbcopy">Copy my feedback</button>
      ${FEEDBACK_URL?`<a class="btn ghost" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener" style="text-decoration:none">Open the feedback form</a>`:''}
      <span class="toast" id="fbtoast" aria-live="polite"></span>
    </div>
    <textarea id="fbout" readonly hidden style="min-height:90px"></textarea>
    <p class="hint">${FEEDBACK_URL?'Copy your feedback, then paste it into the form.':'Copy your feedback and send it to whoever shared this test with you.'}</p>
    <div class="foot">
      <button class="btn ghost" id="again">Take it again</button>
      <small>A mirror, not a diagnosis.</small>
    </div>
    <p class="method">How this works: your taps build a profile on the six Holland interest types (RIASEC), the model the U.S. Department of Labor's <a href="https://www.onetonline.org/" target="_blank" rel="noopener">O*NET</a> uses to describe occupations, plus four style axes. Jobs and hobbies are ranked by how closely their profile matches yours. The interest codes in this page are approximations written for this project, not official O*NET data, so treat the lists as starting points and follow the links for the official entries.</p>
  </section>`, null);

  const shareTxt=[`What You Like says I am ${R.title.replace(/^S/,'s')}.`, `Strongest strands: ${R.r.slice(0,3).map(t=>T[t].name).join(', ')} (${R.code}).`, `Might suit: ${R.cls.map(c=>c.cl).join(', ')}.`, `Worth trying: ${R.hobbies.slice(0,3).map(h=>h.n).join(', ')}.`].join('\n');
  const paint=()=>{ try { $('#cardimg').src=drawCard(R); } catch {} };
  paint(); try { document.fonts.ready.then(()=>{ if (S.phase==='result' && $('#cardimg')) paint(); }); } catch {}
  $('#copy').onclick=()=>copyText(shareTxt, $('#toast'), $('#copyfb'));
  document.querySelectorAll('[data-rate]').forEach(b=>{
    if (+b.dataset.rate===S.rating) b.classList.add('picked');
    b.onclick=()=>{ S.rating=+b.dataset.rate; document.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('picked',x===b)); $('#fbtoast').textContent=''; };
  });
  $('#fbcopy').onclick=()=>{
    if (!S.rating){ $('#fbtoast').textContent='Pick a rating from 1 to 5 first.'; return; }
    const guessR={yes:"That's me",partly:'Partly',no:'Not really'}[S.reaction]||'';
    const txt=[`What You Like feedback`, `Result: ${R.code} · ${R.title}`, `Fields: ${R.cls.map(c=>c.cl).join(', ')}`, `Guess reaction: ${guessR}`, `Accuracy rating: ${S.rating}/5`, `Comment: ${$('#fbtext').value.trim()||'(none)'}`].join('\n');
    copyText(txt, $('#fbtoast'), $('#fbout'));
  };
  $('#again').onclick=()=>{ S=fresh(); renderIntro(); };
}

/* ---------------- Theme + boot ---------------- */
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>requestAnimationFrame(redrawAll)); } catch {}
new MutationObserver(()=>requestAnimationFrame(redrawAll)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(redrawAll,200); });

function start(data){
  const d=data && data.S;
  S = (d && d.phase && Array.isArray(d.plan) && Array.isArray(d.used)) ? d : fresh();
  if (S.phase==='result') return renderResult();
  if (S.phase==='q') return next();
  if (S.phase==='confirm'){ S.guess=null; return next(); }
  S=fresh(); renderIntro();
}
try { window.claude?.hot?.snapshot?.(()=>({S})); } catch {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
</body></html>
